<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蹦床训练档案</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container trampoline-shell-page">
        <header>
            <h1>🤸 蹦床训练档案</h1>
            <p>保留页面逻辑入口，当前以中文占位态承接后续运动员档案与训练偏好。</p>
            <nav class="main-nav">
                <ul>
                    <li><a href="/" class="nav-link">首页</a></li>
                    <li><a href="/video_analysis" class="nav-link">视频分析</a></li>
                    <li><a href="/dashboard" class="nav-link">仪表盘</a></li>
                    <li><a href="/profile" class="nav-link active">档案</a></li>
                </ul>
            </nav>
        </header>

        <div class="profile-content profile-placeholder-content">
            <section class="profile-header profile-placeholder-header">
                <div class="profile-avatar">
                    <div class="avatar-circle placeholder-avatar">
                        <span>{{ athlete.name[:2] }}</span>
                    </div>
                </div>
                <div class="profile-info">
                    <h2>{{ athlete.name }}</h2>
                    <p class="profile-title">{{ athlete.title }}</p>
                    <p class="member-since">页面保留时间：{{ athlete.joined }}</p>
                </div>
            </section>

            <div class="profile-grid profile-placeholder-grid">
                {% for card in cards %}
                <section class="profile-card placeholder-card">
                    <h3>{{ card.title }}</h3>
                    <ul class="placeholder-list">
                        {% for item in card['items'] %}
                        <li>{{ item }}</li>
                        {% endfor %}
                    </ul>
                </section>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
