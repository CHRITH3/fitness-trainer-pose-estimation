<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蹦床项目首页</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container trampoline-shell-page">
        <header>
            <h1>🤸 蹦床视频分析</h1>
            <p>首页已切换为蹦床实时页面预留壳层，当前主入口是视频上传、标定与分析。</p>
            <nav class="nav-links">
                <a href="/video_analysis" class="nav-link">🎬 进入视频分析</a>
                <a href="/dashboard" class="nav-link">📊 查看仪表盘</a>
                <a href="/profile" class="nav-link">👤 训练档案</a>
            </nav>
        </header>

        <div class="main-content trampoline-shell-layout">
            <section class="video-container trampoline-hero-card">
                <div class="video-placeholder trampoline-placeholder-card">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">🧭</div>
                        <p>这里保留为后续“蹦床实时相机页”入口。</p>
                        <p class="placeholder-subcopy">当前版本先聚焦上传视频后的床面标定、跳次检测、动作识别与 AI 分析。</p>
                        <a href="/video_analysis" class="btn primary-btn">前往蹦床视频分析</a>
                    </div>
                </div>
            </section>

            <aside class="controls trampoline-shell-sidebar">
                <section class="capability-summary trampoline-info-block">
                    <h2>当前可用能力</h2>
                    <div class="capability-panel">
                        <ul class="placeholder-list">
                            <li>上传蹦床视频</li>
                            <li>首帧 / 关键帧床面四角标定</li>
                            <li>跳次分割与动作识别</li>
                            <li>处理后视频与 AI 讲解</li>
                        </ul>
                    </div>
                </section>

                <section class="roadmap-summary trampoline-info-block">
                    <h2>后续规划占位</h2>
                    <div class="config-inputs placeholder-metrics">
                        <div class="input-group shell-metric-card">
                            <label>实时相机页</label>
                            <div class="shell-metric-value">待开发</div>
                        </div>
                        <div class="input-group shell-metric-card">
                            <label>训练看板接入</label>
                            <div class="shell-metric-value">已预留</div>
                        </div>
                    </div>
                </section>

                <section class="transition-status trampoline-info-block">
                    <h2>迁移说明</h2>
                    <div class="status-display shell-status-list">
                        <div class="status-item">
                            <span class="status-label">路由</span>
                            <span class="status-value">保持不变</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">健身功能</span>
                            <span class="status-value">已移除</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">蹦床主线</span>
                            <span class="status-value">保留并继续开发</span>
                        </div>
                    </div>
                </section>
            </aside>
        </div>
    </div>
</body>
</html>
