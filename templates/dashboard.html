<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蹦床仪表盘</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container trampoline-shell-page">
        <header>
            <h1>蹦床仪表盘</h1>
            <p>保留图表与摘要布局，作为后续蹦床训练数据看板的占位页。</p>
            <nav class="main-nav">
                <ul>
                    <li><a href="/" class="nav-link">首页</a></li>
                    <li><a href="/dashboard" class="nav-link active">仪表盘</a></li>
                    <li><a href="/profile" class="nav-link">档案</a></li>
                    <li><a href="/video_analysis" class="nav-link">视频分析</a></li>
                </ul>
            </nav>
        </header>

        <div class="dashboard-content trampoline-dashboard-shell">
            <div class="stats-summary">
                {% for card in summary_cards %}
                <div class="stat-card">
                    <h3>{{ card.title }}</h3>
                    <p class="stat-value">{{ card.value }}</p>
                    <p class="stat-note">{{ card.note }}</p>
                </div>
                {% endfor %}
            </div>

            <div class="charts-container">
                <div class="chart-card">
                    <h3>训练热度占位图</h3>
                    <canvas id="weeklyChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>动作分布占位图</h3>
                    <canvas id="actionChart"></canvas>
                </div>
            </div>

            <div class="project-notes trampoline-dashboard-notes">
                <h2>当前迁移说明</h2>
                <ul class="placeholder-list">
                    {% for item in highlights %}
                    <li>{{ item }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>

    <script>
        const weeklyData = {
            labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
            datasets: [{
                label: '占位数据',
                data: [2, 3, 2, 4, 3, 1, 2],
                backgroundColor: 'rgba(52, 152, 219, 0.45)',
                borderColor: 'rgba(52, 152, 219, 1)',
                borderWidth: 1,
            }],
        };

        const landingData = {
            labels: ['基础跳', '团身', '分腿', '预留动作'],
            datasets: [{
                data: [35, 25, 20, 20],
                backgroundColor: [
                    'rgba(52, 152, 219, 0.7)',
                    'rgba(46, 204, 113, 0.7)',
                    'rgba(155, 89, 182, 0.7)',
                    'rgba(241, 196, 15, 0.7)'
                ],
                borderWidth: 1,
            }],
        };

        window.addEventListener('DOMContentLoaded', () => {
            new Chart(document.getElementById('weeklyChart'), {
                type: 'bar',
                data: weeklyData,
                options: { responsive: true, scales: { y: { beginAtZero: true } } },
            });
            new Chart(document.getElementById('actionChart'), {
                type: 'doughnut',
                data: landingData,
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } },
                },
            });
        });
    </script>
</body>
</html>
